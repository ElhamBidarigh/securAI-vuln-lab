name: SecurAI Security Scan

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual execution from the Actions tab

jobs:
  scan:
    name: Run security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Gitleaks needs a full history

      # ── Gitleaks ────────────────────────────────
      - name: Gitleaks — scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Convert Gitleaks output
        if: always()
        run: |
          if [ -f results.sarif ]; then
            mv results.sarif gitleaks-report.json || true
          fi
          # Gitleaks v2 outputs JSON to results.json if configured
          if [ -f gitleaks-report.json ]; then
            echo "Gitleaks report found"
          else
            echo "[]" > gitleaks-report.json
          fi

      # ── Semgrep ─────────────────────────────────
      - name: Semgrep — SAST scan
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/owasp-top-ten
            p/php
            p/javascript
            p/secrets
          generateSarif: true

      # ── Composer audit ──────────────────────────
      - name: Composer audit
        if: hashFiles('composer.lock') != ''
        continue-on-error: true
        run: |
          composer audit --format=json --no-dev > composer-audit.json || true

      # ── npm audit ───────────────────────────────
      - name: npm audit
        if: hashFiles('package-lock.json') != ''
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true

      # ── Build HTML report ───────────────────────
      - name: Build HTML report
        if: always()
        run: python3 .github/scripts/build-report.py

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securAI-report
          path: security-report/

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🛡️ SecurAI Security Scan\n\n';
            try {
              body += fs.readFileSync('summary.md', 'utf8').replace(/^## 🛡️ SecurAI Scan\n\n/, '');
            } catch (e) {
              body += '_No summary generated._\n';
            }
            body += '\n📄 **Full report:** download the `securAI-report` artifact from the Actions tab.\n';
            body += '\n— [SecurAI Audit Tool](https://elhambidarigh.github.io/securai/)';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail on critical findings
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            COUNT=$(jq '[.runs[].results[] | select(.level=="error")] | length' semgrep.sarif 2>/dev/null || echo 0)
            echo "Critical (error-level) findings: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "::error::$COUNT critical security issues found."
              exit 1
            fi
          fi
